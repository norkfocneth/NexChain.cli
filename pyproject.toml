[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexchain"
version = "1.0.0"
description = "Privacy-first Offline Cryptocurrency Forensics & Threat Intelligence CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
    "httpx>=0.25.0",
]

[project.scripts]
nexchain = "sentinel.cli.main:run_cli"
nexsen = "sentinel.cli.main:run_cli"

